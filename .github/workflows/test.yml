name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # dev 工具链（vitest 4 / eslint 8）要求 Node ≥20。
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run verify

  # engines 承诺 >=18 的是发布产物，不是 dev 工具链：
  # Node 18 上验证 tarball 安装、MCP 握手与运行时资产，不跑 vitest/eslint。
  artifact-node-18:
    name: published artifact on Node 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: npm
      - run: npm ci
      - run: npm run verify:artifact

  linux-matrix:
    name: Linux packaging matrix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # 跨主机复核：同一套工具链在不同 Ubuntu runner 上都必须能构建并验证
        # （目标包本身始终在 ubuntu:22.04 验证容器里安装运行，与 runner 无关）。
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run build:clean
      - name: Build and verify Linux packages
        run: |
          mkdir -p .deliverkit .deliverkit/linux-matrix-manifests
          DELIVERKIT_E2E_EVIDENCE_DIR=.deliverkit/linux-matrix-manifests node tests/e2e/linux-matrix.mjs | tee .deliverkit/linux-matrix-result.json
      - name: Upload Linux matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deliverkit-linux-matrix-evidence-${{ matrix.os }}
          path: |
            .deliverkit/linux-matrix-result.json
            .deliverkit/linux-matrix-manifests/*.json
          if-no-files-found: error
