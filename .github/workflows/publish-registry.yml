name: publish-registry

# 发布 server.json 到官方 MCP Registry（registry.modelcontextprotocol.io）。
# 手动触发：本地网络到 github.com/login 设备授权端点不可达时，
# 用 GitHub Actions 的 OIDC 身份免密发布，runner 网络干净。
# 命名空间 io.github.muzimu217 与本仓库所有者一致，OIDC 可验证。

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build official mcp-publisher CLI
        run: |
          git clone --depth 1 https://github.com/modelcontextprotocol/registry /tmp/registry
          cd /tmp/registry && make publisher

      - name: Validate server.json
        run: /tmp/registry/bin/mcp-publisher validate

      - name: Publish to the MCP Registry via OIDC
        run: |
          /tmp/registry/bin/mcp-publisher login github-oidc
          /tmp/registry/bin/mcp-publisher publish server.json
