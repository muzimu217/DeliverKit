name: metrics-snapshot

# 每周一 01:00 UTC（北京时间 09:00）快照 GitHub 流量数据。
# GitHub Insights 只保留 14 天，快照进 metrics/ 目录才能长期留存归因。
#
# 注意：traffic API 不接受 Actions 默认 GITHUB_TOKEN（HTTP 403），
# 需要配置 METRICS_TOKEN secret（classic PAT，repo scope）：
#   gh secret set METRICS_TOKEN -R <owner>/<repo>
# 未配置时快照会记录 traffic_ok: false（不覆盖已有真实数据）。
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect traffic and repo metrics
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%F)
          OUT="metrics/traffic-${DATE}.json"
          mkdir -p metrics

          if gh api "repos/$REPO/traffic/views" > views.json 2>/dev/null; then
            TRAFFIC_OK=true
          else
            TRAFFIC_OK=false
            echo '{"count":null,"uniques":null,"views":[]}' > views.json
            echo '::warning::traffic API 不可用（403）：请配置 METRICS_TOKEN secret（classic PAT, repo scope），见 docs/community/promotion/metrics.md'
          fi
          if ! gh api "repos/$REPO/traffic/clones" > clones.json 2>/dev/null; then
            echo '{"count":null,"uniques":null,"clones":[]}' > clones.json
          fi
          if ! gh api "repos/$REPO/traffic/popular/referrers" > referrers.json 2>/dev/null; then
            echo '[]' > referrers.json
          fi
          if ! gh api "repos/$REPO/traffic/popular/paths" > paths.json 2>/dev/null; then
            echo '[]' > paths.json
          fi

          if [ "$TRAFFIC_OK" = false ] && [ -f "$OUT" ]; then
            echo "::notice::$OUT 已存在且本次 traffic 不可达，跳过覆盖，保留已有真实数据。"
            exit 0
          fi

          gh api "repos/$REPO" --jq '{stars: .stargazers_count, forks: .forks_count, watchers: .subscribers_count, open_issues: .open_issues_count}' > repo.json

          if curl -sf "https://api.npmjs.org/downloads/point/last-week/deliverkit" > npm.json; then
            NPM=$(jq -c '.downloads' npm.json)
          else
            NPM=null
          fi

          jq -n \
            --slurpfile v views.json --slurpfile c clones.json \
            --slurpfile r referrers.json --slurpfile p paths.json \
            --slurpfile ri repo.json \
            --arg date "$DATE" --argjson traffic_ok "$TRAFFIC_OK" --argjson npm_downloads_last_week "$NPM" \
            '{date: $date, traffic_ok: $traffic_ok, repo: $ri[0], npm_downloads_last_week: $npm_downloads_last_week, views: $v[0], clones: $c[0], popular_referrers: $r[0], popular_paths: $p[0]}' \
            > "$OUT"

          rm -f views.json clones.json referrers.json paths.json repo.json npm.json
          echo "::notice::Wrote $OUT"

      - name: Commit snapshot if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/
          if git diff --cached --quiet; then
            echo "No metric changes to commit."
          else
            git commit -m "chore(metrics): traffic snapshot $(date -u +%F)"
            git push
          fi
